<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huỳnh Anh Khoa - Profile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Consolas', 'Courier New', monospace; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; width: 100%; max-width: 400px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; padding: 30px 20px; position: relative; overflow: hidden; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc); }
        .avatar-box { width: 90px; height: 90px; margin: 0 auto 15px auto; border-radius: 50%; background: #0f172a; border: 2px solid #38bdf8; display: flex; align-items: center; justify-content: center; color: #38bdf8; font-size: 32px; font-weight: bold; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
        h1 { font-size: 22px; margin-bottom: 6px; }
        .tag { display: inline-block; background: rgba(56, 189, 248, 0.1); color: #38bdf8; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 20px; border: 1px solid rgba(56, 189, 248, 0.2); }
        .links { display: flex; flex-direction: column; gap: 14px; }
        .link-btn { display: flex; align-items: center; justify-content: center; padding: 14px; background: #334155; color: #f8fafc; text-decoration: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; width: 100%; }
        .link-btn:active { transform: scale(0.97); background: #0f172a; color: #38bdf8; }
        .footer { margin-top: 25px; font-size: 11px; color: #64748b; }
        
        .hidden { display: none !important; }
        .back-btn { display: inline-block; margin-top: 20px; color: #38bdf8; text-decoration: none; font-size: 13px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <!-- TRANG 1: TRANG CHỦ -->
        <div id="page1">
            <div class="avatar-box">&lt;K/&gt;</div>
            <h1>Хуинь Анв Кхоа</h1>
            <div class="tag">⚡ Game Developer / Scripter</div>

            <div class="links">
                <a href="#" class="link-btn">🚀 Kho Dự Án & Scripts</a>
                <button onclick="showPage(2)" class="link-btn">🌐 Mạng Xã Hội</button>
            </div>

            <div class="footer">// Developed by Gemi • 2026</div>
        </div>

        <!-- TRANG 2: MẠNG XÃ HỘI (Chỉ có TikTok & YouTube) -->
        <div id="page2" class="hidden">
            <h1 style="color: #38bdf8; font-size: 20px; margin-bottom: 20px;">🌐 Mạng Xã Hội</h1>

            <div class="links">
                <a href="https://www.tiktok.com/@asta.staria666" class="link-btn" target="_blank">🎵 TikTok (@asta.staria666)</a>
                <a href="https://www.youtube.com/@asta.staria666" class="link-btn" target="_blank">▶️ YouTube (@asta.staria666)</a>
            </div>

            <div onclick="showPage(1)" class="back-btn">⬅️ Quay lại Trang chủ</div>
        </div>
    </div>

    <script>
        function showPage(pageNumber) {
            if (pageNumber === 2) {
                document.getElementById('page1').classList.add('hidden');
                document.getElementById('page2').classList.remove('hidden');
            } else {
                document.getElementById('page2').classList.add('hidden');
                document.getElementById('page1').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
